name: Storefront checks
on:
  push:
    branches: [rebuild/krovinox-clean-start]
  pull_request:
    branches: [rebuild/krovinox-clean-start]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storefront-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - name: Audit dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log(`${name}: severity=${v.severity}, direct=${v.isDirect}, fixAvailable=${JSON.stringify(v.fixAvailable)}`)'
      - name: Verify Playwright CLI
        run: npm run browser:cli -- --help
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krovinox-browser-review
          path: |
            playwright-report/
            test-results/
            npm-audit.json
          if-no-files-found: ignore
          retention-days: 14
