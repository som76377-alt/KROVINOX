name: Foundation checks

on:
  push:
    branches:
      - rebuild/krovinox-clean-start
  pull_request:
    branches:
      - rebuild/krovinox-clean-start
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, catalogue, build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci

      - name: Capture dependency audit reports
        run: |
          npm audit --json > npm-audit-all.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true

      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate design tokens
        run: npm run check:tokens

      - name: Validate product catalogue and demo isolation
        run: npm run check:catalogue

      - name: Unit tests for catalogue and presentation rules
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end browser checks
        run: npm run test:e2e

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: npm-audit-*.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports and visual-review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-browser-review
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
