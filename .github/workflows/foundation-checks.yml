name: Foundation checks

on:
  push:
    branches:
      - rebuild/krovinox-clean-start
  pull_request:
    branches:
      - rebuild/krovinox-clean-start
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tokens, build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies and create a temporary lockfile if absent
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --package-lock-only --ignore-scripts
            npm ci
          fi

      - name: Capture dependency audit reports
        run: |
          npm audit --json > npm-audit-all.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate design tokens
        run: npm run check:tokens

      - name: Validate product catalogue and demo isolation
        run: npm run check:catalogue

      - name: Unit tests for catalogue validation
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end foundation checks
        run: npm run test:e2e

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: npm-audit-*.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload generated dependency lockfile for review
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
